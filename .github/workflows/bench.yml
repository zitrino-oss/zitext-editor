name: Benchmarks

on:
  push:
    branches: [main]
  # Benchmarks track performance over time on main; they don't need to run on
  # every PR (especially noisy Dependabot bumps). Use workflow_dispatch to run
  # them on demand against a branch.
  workflow_dispatch:

# Least privilege: benchmarks only read the repo.
permissions:
  contents: read

jobs:
  rust-benchmarks:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.93.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Run benchmarks
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo bench --bench file_operations -- --output-format bencher 2>&1 | tee bench-output.txt
          node ../scripts/check-benchmark-thresholds.mjs bench-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-results
          path: src-tauri/target/criterion/
